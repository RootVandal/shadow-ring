name: tests & pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/run-node.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The build stamp index.html checks to get past the 10-minute cache (see its loader).
      - name: Write version.json
        run: |
          files=$(find src -type f -name '*.js' | sort | jq -R . | jq -sc .)
          echo "{\"v\":\"$GITHUB_SHA\",\"files\":$files}" > version.json
          head -c 300 version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
