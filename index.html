  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "@mediapipe/tasks-vision": "./vendor/mediapipe/vision_bundle.mjs",
        "qrcode": "./vendor/qrcode/qrcode.mjs"
      }
    }
  </script>
  <link rel="modulepreload" href="vendor/three/three.module.js">
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>
  <main id="ui" aria-live="polite"></main>
  <noscript><p class="noscript">Для игры нужен JavaScript.</p></noscript>
  <script type="module">
    // GitHub Pages lets browsers cache every file for 10 minutes. Right after a
    // deploy that means a mix of old and new modules — a broken page, or two
    // players on different versions. version.json (written by the deploy
    // workflow) names the build: when it changes, refetch the game's files past
    // the cache before anything runs. Locally there's no version.json — skip.
    try {
      const r = await fetch('version.json', { cache: 'no-store' });
      if (r.ok) {
        const { v, files } = await r.json();
        let seen = null;
        try { seen = localStorage.getItem('shadowring:build'); } catch {}
        if (seen !== v) {
          await Promise.all(files.map((f) => fetch(f, { cache: 'reload' }).catch(() => {})));
          try { localStorage.setItem('shadowring:build', v); } catch {}
        }
        document.getElementById('app-css').href = `css/app.css?v=${encodeURIComponent(v)}`;
      }
    } catch {}
    import('./src/main.js');
  </script>
</body>
</html>
